[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-work-hub"
version = "0.1.0"
description = "本地优先的微信群聊多模态 AI 工作助手：采集、多模态处理、任务抽取"
readme = "README.md"
requires-python = ">=3.10"
# 非商业用途，可修改可再分发（详见仓库根目录 LICENSE）
license = { text = "PolyForm Noncommercial License 1.0.0" }
authors = [{ name = "Hello18362" }]

# 核心依赖。Pillow 是桌面卡片渲染（tools/widget/*、tools/desktop_cards.py）必需的，
# 缺了它悬浮窗会在 import 阶段直接 ModuleNotFoundError，所以放核心而不是可选。
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "beautifulsoup4>=4.12.0",
    "Pillow>=10.0.0",
]

# 可选依赖按需安装，避免 MVP 阶段环境过重。
[project.optional-dependencies]
asr = ["faster-whisper>=1.0.3"]
html = ["markdown>=3.5", "python-dotenv>=1.0.0"]
# 桌面软件：pywebview 提供原生窗口；pyinstaller 仅打包时需要
desktop = ["pywebview>=4.2"]
build = ["pyinstaller>=6.0"]
all = ["faster-whisper>=1.0.3", "markdown>=3.5", "python-dotenv>=1.0.0", "pywebview>=4.2"]

[project.scripts]
wgh = "main:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = [
    "collector*",
    "processor*",
    "summarizer*",
    "output*",
    "core*",
    "web*",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
