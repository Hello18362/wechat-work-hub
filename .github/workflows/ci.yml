name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: regression (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11"]

    env:
      # Windows 非中文代码页下 print 中文会崩，CI 里统一强制 UTF-8
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Regression tests
        # tests/test_regression.py / test_sample_client.py / test_launch.py 都是
        # 纯标准库 unittest；tests/test_server.py 需要先起控制台服务，不进 CI。
        run: |
          python tests/test_regression.py
          python tests/test_sample_client.py
          python tests/test_launch.py

      - name: Sanity import
        run: python -c "import main, core.config, output.html, web.server; print('ok')"

      - name: Entry points
        # wgh 入口由 pyproject.toml 的 py-modules=["main"] 提供，这里守住它不碎
        run: |
          python -m main --help
          wgh --help